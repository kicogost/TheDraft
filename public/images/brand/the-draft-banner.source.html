<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1400px;height:420px;background:#241c16;display:flex;flex-direction:column;
       align-items:center;justify-content:center;gap:26px;
       background-image:linear-gradient(to right,#fdf6ec0d 1px,transparent 1px),
                        linear-gradient(to bottom,#fdf6ec0d 1px,transparent 1px);
       background-size:70px 70px}
  .mark{display:flex;align-items:center;gap:26px}
  .tile{width:74px;height:74px;background:#b4552b;display:grid;place-items:center}
  .tile svg{width:40px;fill:#fdf6ec}
  h1{font-family:Anton,sans-serif;font-size:82px;line-height:.98;letter-spacing:.055em;
     color:#fdf6ec;text-transform:uppercase}
  .tag{font-family:"JetBrains Mono",monospace;font-size:15px;letter-spacing:.34em;
       text-transform:uppercase;color:#fdf6ecb3;text-align:center}
  .rule{width:64px;height:3px;background:#b4552b}
  .by{font-family:"JetBrains Mono",monospace;font-size:12.5px;letter-spacing:.34em;
      text-transform:uppercase;color:#fdf6ec80}
</style></head><body>
  <div class="mark">
    <span class="tile"><svg viewBox="0 0 470 331"><path d="M0 0 L235 187 L470 0 L470 331 L0 331 Z"/></svg></span>
    <h1>The Draft</h1>
  </div>
  <div class="rule"></div>
  <div class="tag">Career, marketing, and building an internet income</div>
  <div class="by">By Francisco Gost</div>
</body></html>
